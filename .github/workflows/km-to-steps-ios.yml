name: km-to-steps iOS build

on:
  push:
    paths: ["km-to-steps/**", ".github/workflows/km-to-steps-ios.yml"]
  pull_request:
    paths: ["km-to-steps/**", ".github/workflows/km-to-steps-ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: km-to-steps
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: km-to-steps/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx cap sync ios
      - name: Build for iOS simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/App/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            ios/App/build/DerivedData/Build/Products/Debug-iphonesimulator/App.app \
            km-to-steps-ios-simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: km-to-steps-ios-simulator
          path: km-to-steps/km-to-steps-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
