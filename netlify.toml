# Deploy Afro Mart to Netlify.
#
# The storefront in public/ is served statically, and every /api route is
# handled by a single Function that runs the same app as `npm start`. Because
# Netlify Functions have no persistent disk, the SQLite database is snapshotted
# to Netlify Blobs between requests (see netlify/functions/store.mjs).
[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

# API: hand every /api/* request to the Function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# The staff dashboard lives at /admin (the Node server maps it to admin.html).
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Security headers for the statically-served storefront and dashboard.
# The app has no inline scripts or inline event handlers, so the CSP can stay strict;
# the invoice styles live in /invoice.css rather than an inline <style> block.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' https: data:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
