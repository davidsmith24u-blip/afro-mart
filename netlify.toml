# Deploy Afro Mart to Netlify.
#
# The storefront in public/ is served statically, and every /api route is
# handled by a single Function that runs the same app as `npm start`. Because
# Netlify Functions have no persistent disk, the SQLite database is snapshotted
# to Netlify Blobs between requests (see netlify/functions/store.mjs).
[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

# API: hand every /api/* request to the Function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# The staff dashboard lives at /admin (the Node server maps it to admin.html).
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Security headers for the statically-served storefront and dashboard.
# No inline scripts or inline event handlers are used, so the CSP stays strict. The
# one exception is the inline JSON-LD block in public/index.html, allow-listed by its
# sha256 hash. If that block changes, update the hash here and in src/app.js — the
# test/structured-data.test.js test fails if they drift apart.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-6/SCuzi3l368PQt/BgOUJQCNrkXnrnQkDMSj6CdRhEI='; img-src 'self' https: data:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
